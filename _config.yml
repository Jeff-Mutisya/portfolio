    icon: "fa-solid fa-headset"
    description: >-
      Microsoft 365 administration, VoIP (3CX, Teams Calling, Zoom
      Phone), user support and IT security compliance across multiple
      entities.

  - title: "Automation & Integration"
    icon: "fa-solid fa-robot"
    description: >-
      REST API integrations, workflow automation and AI-assisted
      processes that cut manual work and errors.


