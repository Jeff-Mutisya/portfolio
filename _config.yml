# ============================================================
# ABOUT (NEW)
# ============================================================

about:
  heading: "About Me"
  paragraphs:
    - >-
      I work where business systems meet network infrastructure. My
      career started in telecoms and network engineering and grew into
      ERP consulting, so I can talk to finance teams about their
      processes and to engineers about their networks.
    - >-
      I have delivered around 20 ERP and digital transformation
      projects across manufacturing, FMCG, telecoms, distribution and
      services. I work through the full cycle: discovery, gap analysis,
      configuration, user testing, go-live and support after launch.
    - >-
      I present regularly to CFOs, Finance Directors and CEOs, and I
      write documentation that people actually use.
    - >-
      Outside client work, I care about community connectivity. I have
      helped deploy public Wi-Fi for communities and worked on school
      internet connectivity proposals.

