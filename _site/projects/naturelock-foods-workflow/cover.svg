<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Abstract systems workflow illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4a6e"/>
      <stop offset="1" stop-color="#0d2b44"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a458"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- process flow nodes -->
  <g font-family="Poppins, Arial, sans-serif">
    <rect x="110" y="170" width="180" height="64" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <text x="200" y="208" text-anchor="middle" fill="#ffffff" font-size="20" letter-spacing="1">PROCESS</text>

    <rect x="380" y="170" width="180" height="64" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <text x="470" y="208" text-anchor="middle" fill="#ffffff" font-size="20" letter-spacing="1">SYSTEM</text>

    <rect x="650" y="170" width="180" height="64" rx="14" fill="#e0a458" stroke="#e0a458" stroke-width="1.5"/>
    <text x="740" y="208" text-anchor="middle" fill="#12293c" font-size="20" font-weight="600" letter-spacing="1">DATA</text>

    <rect x="920" y="170" width="180" height="64" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <text x="1010" y="208" text-anchor="middle" fill="#ffffff" font-size="20" letter-spacing="1">PEOPLE</text>

    <line x1="290" y1="202" x2="372" y2="202" stroke="#e0a458" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="560" y1="202" x2="642" y2="202" stroke="#e0a458" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="830" y1="202" x2="912" y2="202" stroke="#e0a458" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- decorative gear -->
  <g transform="translate(1050,80)" stroke="rgba(255,255,255,0.35)" fill="none" stroke-width="2">
    <circle r="26"/>
    <circle r="10"/>
    <g stroke-linecap="round">
      <line x1="0" y1="-38" x2="0" y2="-28"/>
      <line x1="0" y1="28" x2="0" y2="38"/>
      <line x1="-38" y1="0" x2="-28" y2="0"/>
      <line x1="28" y1="0" x2="38" y2="0"/>
      <line x1="-27" y1="-27" x2="-20" y2="-20"/>
      <line x1="20" y1="20" x2="27" y2="27"/>
      <line x1="-27" y1="27" x2="-20" y2="20"/>
      <line x1="20" y1="-20" x2="27" y2="-27"/>
    </g>
  </g>

  <!-- decorative signal path -->
  <path d="M 60 340 C 300 300, 500 380, 740 330 S 1100 300, 1160 340" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="6 8"/>
</svg>
